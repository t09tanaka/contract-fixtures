name: contract_fixtures_dio
description: >-
  A dio adapter that answers with contract_fixtures fixtures, so a client built
  on dio reads the responses its API really gave. With a helper for the request.
version: 0.2.0
repository: https://github.com/t09tanaka/contract-fixtures/tree/main/packages/dart_dio
issue_tracker: https://github.com/t09tanaka/contract-fixtures/issues
topics:
  - testing
  - api
  - contract-testing
  - fixtures
  - dio

environment:
  sdk: ^3.5.0

dependencies:
  contract_fixtures: ^0.2.0
  dio: ^5.0.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
